<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Task 2</title>
</head>
<body>
    <div id="intro">
        <h1>Model Signup Form</h1>
        <button id="btn" onclick="showform()">Sign up</button>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="form-container" id="signform">
        <form action="#">
            <button class="close-btn" onclick="showintro()">X</button>
            <h1>Sign Up</h1>
            <p>Please fill in this form to create an account.</p>
            <hr>
            <label for="eminput">Email</label>
            <input type="email" name="email" required id="eminput" placeholder="Enter Email">
            <br>
            <label for="passinput">Password</label>
            <input type="password" name="password" required id="passinput" placeholder="Enter Password">
            <br>
            <label for="reppassinput">Repeat Password</label>
            <input type="password" name="password" required id="reppassinput" placeholder="Repeat Password">
            <br>
            <input type="checkbox" id="check" name="remember me"><label for="ckeck">Remember me</label>

            <p>By creating an account you agree to our <a href="">Terms & Privacy</a></p>
            <br>
            <button id="cancel" onclick="showintro()">Cancel</button>
            <button id="sign" onclick="showintro()">Sign up</button>
            
        </form>
    </div>

    <script>
        function showform(){
    document.getElementById('signform').style.display="block";
    document.getElementById("overlay").style.display = "block";
    document.getElementById('intro').style.display="none";

}
function showintro(){
    document.getElementById('signform').style.display="none";
    document.getElementById("overlay").style.display = "none";
    document.getElementById('intro').style.display="block";
}
    </script>
</body>
</html>
